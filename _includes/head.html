<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F2E7">
<script>
  // Hide scroll-reveal content up front (no flash); show everything if site.js has not started within 3s
  document.documentElement.classList.add('js', 'reveal-ready');
  setTimeout(function () { if (!window.__siteReady) document.documentElement.classList.remove('reveal-ready'); }, 3000);
</script>
